name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  firebase-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix ai-service
      - run: npm ci --prefix firebase
      - name: Validate Firebase isolation in local emulators
        run: npm test --prefix firebase
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'

  deploy:
    needs: firebase-security
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install AI service dependencies
        run: npm ci --prefix ai-service

      - name: Validate static project
        run: |
          node tools/check-i18n.mjs
          node tools/check-assets.mjs
          node tools/check-firebase-config.mjs
          node tools/check-js-syntax.mjs
          node --check ai-service/server.js
          node --check service-worker.js
          node --check tools/check-assets.mjs
          node --check tools/check-i18n.mjs
          node --check tools/check-js-syntax.mjs
          npm test --prefix ai-service
          node --test tools/tests/*.test.mjs
          npm audit --prefix ai-service --omit=dev --audit-level=moderate
          CHROME_PATH=/usr/bin/google-chrome node tools/check-responsive-layout.mjs
          CHROME_PATH=/usr/bin/google-chrome node tools/check-responsive-layout.mjs exclusao-conta.html
          CHROME_PATH=/usr/bin/google-chrome EDUCARIA_AUDIT_STORAGE_FAILURE=1 node tools/check-responsive-layout.mjs 'auth:plataforma/quiz-builder.html?new=1'
          CHROME_PATH=/usr/bin/google-chrome EDUCARIA_AUDIT_RECOVERY=1 EDUCARIA_AUDIT_DISABLE_DASHBOARD_TOUR=1 node tools/check-responsive-layout.mjs auth:plataforma/index.html auth:plataforma/slides-builder.html auth:plataforma/criar-aula.html
          CHROME_PATH=/usr/bin/google-chrome node tools/check-responsive-layout.mjs 'auth:plataforma/quiz-builder.html?new=1' 'auth:plataforma/slides-builder.html?new=1' 'auth:plataforma/flashcards-builder.html?new=1' 'auth:plataforma/jogo-memoria-builder.html?new=1' 'auth:plataforma/forca-builder.html?new=1' 'auth:plataforma/roleta-builder.html?new=1' 'auth:plataforma/ligar-pontos-builder.html?new=1'
          CHROME_PATH=/usr/bin/google-chrome node tools/check-responsive-layout.mjs plataforma/apresentacao.html plataforma/quiz-aplicacao.html plataforma/flashcards-apresentacao.html plataforma/jogo-memoria-apresentacao.html plataforma/roleta-apresentacao.html plataforma/ligar-pontos-apresentacao.html plataforma/mapa-mental-apresentacao.html plataforma/debate-guiado-apresentacao.html plataforma/caca-palavras-apresentacao.html plataforma/palavras-cruzadas-apresentacao.html plataforma/forca-apresentacao.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public-only artifact
        id: pages-build
        run: node tools/build-pages.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.pages-build.outputs.path }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
