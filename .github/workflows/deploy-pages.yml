name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject Firebase runtime config
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.EDUCARIA_FIREBASE_CONFIG_JSON }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const raw = process.env.FIREBASE_CONFIG_JSON || "";

          if (!raw.trim()) {
              console.warn("EDUCARIA_FIREBASE_CONFIG_JSON is not configured; skipping Firebase runtime config injection.");
              process.exit(0);
          }

          const config = JSON.parse(raw);
          const content = `(function configureEducariaFirebaseRuntime() {
              if (typeof window.setEducariaFirebaseConfig !== "function") return;

              window.setEducariaFirebaseConfig(${JSON.stringify(config, null, 4)}, { persist: true });
          })();
          `;

          fs.writeFileSync("assets/js/firebase-config.local.js", content, "utf8");
          NODE

      - name: Install AI service dependencies
        run: npm ci --prefix ai-service

      - name: Validate static project
        run: |
          node tools/check-i18n.mjs
          node tools/check-assets.mjs
          node tools/check-js-syntax.mjs
          node --check ai-service/server.js
          node --check service-worker.js
          node --check tools/check-assets.mjs
          node --check tools/check-i18n.mjs
          node --check tools/check-js-syntax.mjs
          npm test --prefix ai-service
          npm audit --prefix ai-service --omit=dev --audit-level=moderate
          CHROME_PATH=/usr/bin/google-chrome node tools/check-responsive-layout.mjs
          CHROME_PATH=/usr/bin/google-chrome node tools/check-responsive-layout.mjs 'auth:plataforma/quiz-builder.html?new=1' 'auth:plataforma/slides-builder.html?new=1' 'auth:plataforma/flashcards-builder.html?new=1' 'auth:plataforma/jogo-memoria-builder.html?new=1' 'auth:plataforma/forca-builder.html?new=1' 'auth:plataforma/roleta-builder.html?new=1' 'auth:plataforma/ligar-pontos-builder.html?new=1'
          CHROME_PATH=/usr/bin/google-chrome node tools/check-responsive-layout.mjs plataforma/apresentacao.html plataforma/quiz-aplicacao.html plataforma/flashcards-apresentacao.html plataforma/jogo-memoria-apresentacao.html plataforma/roleta-apresentacao.html plataforma/ligar-pontos-apresentacao.html plataforma/mapa-mental-apresentacao.html plataforma/debate-guiado-apresentacao.html plataforma/caca-palavras-apresentacao.html plataforma/palavras-cruzadas-apresentacao.html plataforma/forca-apresentacao.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
